<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerologia da Prosperidade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .result-preview {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .number-display {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            margin: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Etapa 1: Dados Iniciais -->
        <div class="step active" id="step1">
            <h1>🔮 Numerologia da Prosperidade</h1>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">Descubra seu mapa numerológico</p>

            <form id="initialForm">
                <div class="form-group">
                    <label for="fullName">Nome Completo</label>
                    <input type="text" id="fullName" required placeholder="Seu nome">
                </div>

                <div class="form-group">
                    <label for="birthDate">Data de Nascimento</label>
                    <input type="date" id="birthDate" required>
                </div>

                <button type="submit">Calcular Meu Mapa ✨</button>
            </form>
        </div>

        <!-- Etapa 2: Processando -->
        <div class="step" id="step2">
            <div class="loading">
                <div class="spinner"></div>
                <h2>Calculando seu mapa...</h2>
            </div>
        </div>

        <!-- Etapa 3: Preview -->
        <div class="step" id="step3">
            <h1>✨ Seu Mapa Está Pronto!</h1>

            <div class="result-preview">
                <h3>Seus Números Principais:</h3>
                <div style="text-align: center;">
                    <div class="number-display" id="lifePathPreview">-</div>
                    <div class="number-display" id="destinyPreview">-</div>
                    <div class="number-display" id="soulPreview">-</div>
                </div>
            </div>

            <form id="leadForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" required placeholder="(00) 00000-0000">
                </div>

                <button type="submit">Receber Relatório - R$ 19,90 🎁</button>
            </form>

            <div id="errorMessage" class="error" style="display: none;"></div>
        </div>

        <!-- Etapa 4: Enviando -->
        <div class="step" id="step4">
            <div class="loading">
                <div class="spinner"></div>
                <h2>Gerando seu relatório...</h2>
                <p style="color: #666; margin-top: 10px;">Você será redirecionado em instantes</p>
            </div>
        </div>
    </div>

    <script>
        let userData = {};

        // Etapa 1: Calcular números
        document.getElementById('initialForm').addEventListener('submit', function(e) {
            e.preventDefault();

            userData.fullName = document.getElementById('fullName').value;
            userData.birthDate = document.getElementById('birthDate').value;

            calculateNumerology();
            showStep(2);

            setTimeout(() => {
                showStep(3);
                displayPreview();
            }, 2000);
        });

        // Etapa 3: Enviar para gerar PDF
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            userData.email = document.getElementById('email').value;
            userData.phone = document.getElementById('phone').value;

            showStep(4);

            try {
                // Chamar API para gerar PDF
                const response = await fetch('/api/generate-pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: userData.email,
                        fullName: userData.fullName,
                        lifePath: userData.lifePath,
                        destiny: userData.destiny,
                        soul: userData.soul
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Erro ao gerar relatório');
                }

                // Redirecionar para Hotmart após 2 segundos
                setTimeout(() => {
                    window.location.href = 'https://pay.hotmart.com/J103934459T';
                }, 2000);

            } catch (error) {
                console.error('Erro:', error);
                showStep(3);
                document.getElementById('errorMessage').textContent = 'Erro: ' + error.message;
                document.getElementById('errorMessage').style.display = 'block';
            }
        });

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
        }

        function calculateNumerology() {
            const date = new Date(userData.birthDate);
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();

            userData.lifePath = reduceToSingleDigit(day + month + year);
            userData.destiny = calculateNameNumber(userData.fullName);
            userData.soul = calculateVowelNumber(userData.fullName);
        }

        function reduceToSingleDigit(num) {
            while (num > 9 && num !== 11 && num !== 22 && num !== 33) {
                num = String(num).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
            }
            return num;
        }

        function calculateNameNumber(name) {
            const values = {
                'a': 1, 'b': 2, 'c': 3, 'd': 4, 'e': 5, 'f': 6, 'g': 7, 'h': 8, 'i': 9,
                'j': 1, 'k': 2, 'l': 3, 'm': 4, 'n': 5, 'o': 6, 'p': 7, 'q': 8, 'r': 9,
                's': 1, 't': 2, 'u': 3, 'v': 4, 'w': 5, 'x': 6, 'y': 7, 'z': 8
            };

            let sum = 0;
            name.toLowerCase().split('').forEach(char => {
                if (values[char]) sum += values[char];
            });

            return reduceToSingleDigit(sum);
        }

        function calculateVowelNumber(name) {
            const values = { 'a': 1, 'e': 5, 'i': 9, 'o': 6, 'u': 3 };
            let sum = 0;
            name.toLowerCase().split('').forEach(char => {
                if (values[char]) sum += values[char];
            });
            return reduceToSingleDigit(sum);
        }

        function displayPreview() {
            document.getElementById('lifePathPreview').textContent = userData.lifePath;
            document.getElementById('destinyPreview').textContent = userData.destiny;
            document.getElementById('soulPreview').textContent = userData.soul;
        }
    </script>
</body>
</html>
